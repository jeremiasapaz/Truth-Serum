services:
  - type: pserv
    name: truth-serum-db
    plan: free
    databaseName: transparency
    region: oregon
  
  - type: web
    name: truth-serum
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: truth-serum-db
          property: connectionString
      - key: VERIFY_SSL
        value: "false"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_BACKUP_KEY
        sync: false
      - key: LLM_BACKUP_BASE_URL
        value: https://api.mistral.ai/v1
      - key: LLM_BACKUP_MODEL
        value: open-mistral-7b
  - type: cron
    name: batch-ingest
    env: python
    plan: free
    schedule: "0 13 * * *"  # 8 AM EST = 1 PM UTC (EST is UTC-5)
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m app.cron.batch_ingest
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: truth-serum-db
          property: connectionString
      - key: VERIFY_SSL
        value: "false"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_BACKUP_KEY
        sync: false
      - key: LLM_BACKUP_BASE_URL
        value: https://api.mistral.ai/v1
      - key: LLM_BACKUP_MODEL
        value: open-mistral-7b
